                    document.getElementById("bg-err").textContent = templateError; const pw = document.getElementById("staticrypt-password"); if (pw.type === "password") toggleIcon.click(); pw.focus(); pw.setSelectionRange(pw.value.length, pw.value.length);
                }
            });
        </script>
    </body>
